<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<title>Маълумотнома</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: #525659; color: #fff;
    display: flex; flex-direction: column;
  }
  header {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: #323639; border-bottom: 1px solid #1f2123;
  }
  #name {
    flex: 1; min-width: 0; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button, a.dl {
    font: inherit; font-size: 14px; line-height: 1;
    padding: 8px 11px; border: 1px solid #55595c; background: #414548;
    color: #fff; border-radius: 6px; cursor: pointer; text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  button:active, a.dl:active { background: #55595c; }
  button:disabled { opacity: .4; }
  a.dl { background: #2f6fed; border-color: #2f6fed; white-space: nowrap; }
  #zoom { min-width: 46px; text-align: center; font-size: 13px; color: #d6d8da; }
  main { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 12px 0 28px; }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  canvas {
    display: block; background: #fff; max-width: 100%;
    box-shadow: 0 2px 8px rgba(0,0,0,.45);
  }
  #status { text-align: center; padding: 40px 20px; color: #d6d8da; font-size: 15px; }
  @media (max-width: 420px) {
    button, a.dl { padding: 8px 9px; font-size: 13px; }
    #name { font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <div id="name">Юкланмоқда...</div>
  <button id="out" title="Кичрайтириш">−</button>
  <span id="zoom">100%</span>
  <button id="in" title="Катталаштириш">+</button>
  <a class="dl" id="dl" href="#">Юклаб олиш</a>
</header>

<main>
  <div id="status">Маълумотнома юкланмоқда...</div>
  <div id="pages"></div>
</main>

<script type="module">
import * as pdfjsLib from "/vendor/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc = "/vendor/pdf.worker.min.mjs";

const id = location.pathname.split("/").filter(Boolean).pop();
const fileUrl = "/f/" + id;

const $ = (x) => document.getElementById(x);
$("dl").href = fileUrl + "?download=1";

let pdf = null;
let zoom = 1;
let rendering = false;

// Ekran kengligiga moslab asosiy masshtabni topish
function fitScale(page) {
  const v = page.getViewport({ scale: 1 });
  const avail = Math.min(document.querySelector("main").clientWidth - 24, 1100);
  return avail / v.width;
}

async function renderAll() {
  if (!pdf || rendering) return;
  rendering = true;
  const box = $("pages");
  box.innerHTML = "";
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const scale = fitScale(page) * zoom;
    const vp = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(vp.width * dpr);
    canvas.height = Math.floor(vp.height * dpr);
    canvas.style.width = Math.floor(vp.width) + "px";
    canvas.style.height = Math.floor(vp.height) + "px";
    box.appendChild(canvas);
    await page.render({
      canvasContext: canvas.getContext("2d"),
      viewport: vp,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null,
    }).promise;
  }
  $("zoom").textContent = Math.round(zoom * 100) + "%";
  rendering = false;
}

function setZoom(z) {
  zoom = Math.min(4, Math.max(0.5, z));
  $("out").disabled = zoom <= 0.5;
  $("in").disabled = zoom >= 4;
  renderAll();
}

$("in").onclick = () => setZoom(zoom + 0.25);
$("out").onclick = () => setZoom(zoom - 0.25);

// Ekran burilganda qayta chizish
let t;
window.addEventListener("resize", () => {
  clearTimeout(t);
  t = setTimeout(renderAll, 250);
});

(async () => {
  try {
    const info = await fetch("/info/" + id).then((r) => r.json());
    if (info.name) {
      $("name").textContent = info.name;
      document.title = info.name;
    }
    pdf = await pdfjsLib.getDocument({
      url: fileUrl,
      cMapUrl: "/vendor/cmaps/",
      cMapPacked: true,
      standardFontDataUrl: "/vendor/standard_fonts/",
    }).promise;
    $("status").style.display = "none";
    await renderAll();
  } catch (e) {
    $("status").innerHTML =
      "Маълумотномани кўрсатиб бўлмади.<br><br>" +
      '<a class="dl" href="' + fileUrl + '">PDF ни очиш</a>';
  }
})();
</script>
</body>
</html>
